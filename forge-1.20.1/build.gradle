plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id
base.archivesName = 'QuadHotbar-1.20.1-forge'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.java.srcDir('src/gametest/java')
mixin {
    add sourceSets.main, 'quadhotbar.refmap.json'
    config 'quadhotbar.mixins.json'
}
repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file("run/${name}")
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'quadhotbar.overviewSmoke', project.findProperty('overviewSmoke') ?: 'false'
            property 'quadhotbar.overviewRestartCheck', project.findProperty('overviewRestartCheck') ?: 'false'
        }

        server {
            args '--nogui'
        }

        gameTestServer { property 'forge.gameTestServer', 'true' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // ForgeGradle remaps published SRG-named fixtures into the development namespace.
    ['compatCorpseJar', 'compatGravestoneJar'].each { fixture ->
        if (project.hasProperty(fixture)) {
            def fixtureFile = file(project.property(fixture))
            repositories.flatDir { dirs fixtureFile.parentFile }
            runtimeOnly fg.deobf("quadhotbar.compat:${fixtureFile.name.take(fixtureFile.name.length() - 4)}:local")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude('com/archiangel/quadhotbar/gametest/**')
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'quadhotbar.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

// Optional local Maven publication; Forge artifacts must be reobfuscated.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
