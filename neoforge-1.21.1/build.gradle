plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id
base.archivesName = 'QuadHotbar-1.21.1-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Development runs include regression fixtures; release JARs never include them.
sourceSets.main.java.srcDir('src/gametest/java')
tasks.named('jar', Jar).configure {
    exclude('com/archiangel/quadhotbar/gametest/**')
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    client {
        systemProperty 'quadhotbar.overviewSmoke', providers.gradleProperty('overviewSmoke').getOrElse('false')
        systemProperty 'quadhotbar.overviewRestartCheck', providers.gradleProperty('overviewRestartCheck').getOrElse('false')
    }

    server {
        argument '--nogui'
    }

    // Runs all registered GameTests and exits with their result.
    gameTestServer {}
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Opt-in integration fixture, never bundled into the released mod.
    if (project.hasProperty('compatCorpseJar')) {
        runtimeOnly files(project.property('compatCorpseJar'))
    }
    if (project.hasProperty('compatGravestoneJar')) {
        runtimeOnly files(project.property('compatGravestoneJar'))
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

// Optional local Maven publication.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
